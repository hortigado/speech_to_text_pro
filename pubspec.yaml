name: speech_to_text_pro
description: "High-performance, continuous speech-to-text plugin with smart punctuation, auto-restart, and deep session analytics."
version: 0.0.1
homepage: https://github.com/shirsh94/speech_to_text_pro
repository: https://github.com/shirsh94/speech_to_text_pro
issue_tracker: https://github.com/shirsh94/speech_to_text_pro/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.0.0
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.speech_to_text_pro
        pluginClass: SpeechToTextProPlugin
      ios:
        pluginClass: SpeechToTextProPlugin
      macos:
        pluginClass: SpeechToTextProPlugin
      windows:
        pluginClass: SpeechToTextProPluginCApi
      linux:
        pluginClass: SpeechToTextProPlugin
      web:
        pluginClass: SpeechToTextProWeb
        fileName: speech_to_text_pro_web.dart
